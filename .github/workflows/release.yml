name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  build:
    name: Validar e gerar artefatos
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15'
      - name: Validar tag, versão e notas
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Use uma tag de versão estável no formato vX.Y.Z.")
          if tag != f"v{version}":
              raise SystemExit("A tag deve corresponder à versão em pyproject.toml.")
          notes = Path(f"docs/release-{version}.md")
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"Notas de versão ausentes ou vazias: {notes}")
          PY
      - name: Instalar dependências
        run: uv sync
      - name: Lint
        run: uv run --no-sync ruff check pyield tests
      - name: Tipos
        run: uv run --no-sync ty check
      - name: Gerar documentação
        run: uv run --no-sync zensical build --clean --strict
      - name: Gerar distribuições
        run: uv build --no-sources --clear
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pypi:
    name: Publicar no PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyield/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
      - name: Publicar com Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  pages:
    name: Publicar documentação
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    name: Publicar notas no GitHub
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "docs/release-${RELEASE_TAG#v}.md"
